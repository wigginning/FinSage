<!DOCTYPE html>
<html lang="zh" class="light">
<head>
    <meta charset="UTF-8">

    <title>Preflight</title>
    <style id="theme-vars">
/* FinSage UI — Professional Institutional Finance Design Tokens */
/* Light mode default; dark mode toggled via <html class="dark"> */

@import "tailwindcss";

@theme inline {
  --color-background: var(--background);
  --color-foreground: var(--foreground);
  --color-card: var(--card);
  --color-card-foreground: var(--card-foreground);
  --color-popover: var(--popover);
  --color-popover-foreground: var(--popover-foreground);
  --color-primary: var(--primary);
  --color-primary-foreground: var(--primary-foreground);
  --color-muted: var(--muted);
  --color-muted-foreground: var(--muted-foreground);
  --color-border: var(--border);
  --color-input: var(--input);
  --color-ring: var(--ring);
  --radius-sm: var(--radius-sm);
  --radius-md: var(--radius-md);
  --radius-lg: var(--radius-lg);
}

:root {
  /* Brand primary: deep indigo */
  --brand-50: #eef4ff;
  --brand-100: #dbeafe;
  --brand-200: #bfdbfe;
  --brand-300: #93c5fd;
  --brand-400: #60a5fa;
  --brand-500: #3b82f6;
  --brand-600: #2563eb;
  --brand-700: #1d4ed8;
  --brand-800: #1e40af;
  --brand-900: #1e3a8a;

  /* Neutral: cool slate */
  --neutral-0: #ffffff;
  --neutral-50: #f8fafc;
  --neutral-100: #f1f5f9;
  --neutral-200: #e2e8f0;
  --neutral-300: #cbd5e1;
  --neutral-400: #94a3b8;
  --neutral-500: #64748b;
  --neutral-600: #475569;
  --neutral-700: #334155;
  --neutral-800: #1e293b;
  --neutral-900: #0f172a;

  /* State semantic */
  --state-success: #059669;
  --state-success-bg: #ecfdf5;
  --state-warning: #d97706;
  --state-warning-bg: #fffbeb;
  --state-error: #dc2626;
  --state-error-bg: #fef2f2;
  --state-info: #2563eb;
  --state-info-bg: #eff6ff;

  /* Spacing scale (8pt grid) */
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 24px;
  --s-6: 32px;
  --s-7: 48px;
  --s-8: 64px;
  --s-9: 80px;

  /* Radius */
  --radius-xs: 2px;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* Shadow */
  --shadow-1: 0 1px 2px rgba(15, 23, 42, 0.05), 0 1px 1px rgba(15, 23, 42, 0.03);
  --shadow-2: 0 8px 24px -8px rgba(15, 23, 42, 0.12);
  --shadow-3: 0 24px 60px -20px rgba(15, 23, 42, 0.22);

  /* Typography */
  --font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "SF Mono", "Fira Code", "Noto Sans Mono", monospace;

  /* Semantic tokens — light */
  --background: var(--neutral-50);
  --foreground: var(--neutral-900);
  --card: var(--neutral-0);
  --card-foreground: var(--neutral-900);
  --popover: var(--neutral-0);
  --popover-foreground: var(--neutral-900);
  --primary: var(--brand-700);
  --primary-foreground: var(--neutral-0);
  --muted: var(--neutral-100);
  --muted-foreground: var(--neutral-500);
  --border: var(--neutral-200);
  --input: var(--neutral-200);
  --ring: var(--brand-500);
}

html.dark {
  /* Semantic tokens — dark */
  --background: #0b0c10;
  --foreground: var(--neutral-100);
  --card: #12131a;
  --card-foreground: var(--neutral-100);
  --popover: #12131a;
  --popover-foreground: var(--neutral-100);
  --primary: var(--brand-500);
  --primary-foreground: var(--neutral-0);
  --muted: #1a1c25;
  --muted-foreground: var(--neutral-400);
  --border: #272a36;
  --input: #272a36;
  --ring: var(--brand-400);

  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.25), 0 1px 1px rgba(0, 0, 0, 0.15);
  --shadow-2: 0 8px 24px -8px rgba(0, 0, 0, 0.45);
  --shadow-3: 0 24px 60px -20px rgba(0, 0, 0, 0.65);
}

/* Base typography */
body {
  font-family: var(--font-sans);
  background-color: var(--background);
  color: var(--foreground);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* Type scale utilities */
.text-display {
  font-size: clamp(36px, 4vw, 56px);
  line-height: 1.08;
  font-weight: 600;
  letter-spacing: -0.025em;
  text-wrap: balance;
}

.text-h1 {
  font-size: clamp(28px, 3vw, 40px);
  line-height: 1.15;
  font-weight: 600;
  letter-spacing: -0.02em;
  text-wrap: balance;
}

.text-h2 {
  font-size: clamp(22px, 2.2vw, 28px);
  line-height: 1.25;
  font-weight: 600;
  letter-spacing: -0.015em;
  text-wrap: balance;
}

.text-h3 {
  font-size: 18px;
  line-height: 1.35;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.text-body-lg {
  font-size: 16px;
  line-height: 1.65;
}

.text-body {
  font-size: 15px;
  line-height: 1.6;
}

.text-caption {
  font-size: 13px;
  line-height: 1.5;
  letter-spacing: 0.005em;
}

.text-mono {
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.5;
  font-variant-numeric: tabular-nums;
}

/* Tabular numbers for financial data */
.tabular {
  font-variant-numeric: tabular-nums;
}

/* Reduced motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}
