# FinSage Alembic config (T102)
# - script_location: migrations/
# - prepend_sys_path: src  (so finsage.* is importable)
# - sqlalchemy.url: injected by migrations/env.py from FIN_DB_URL/settings; leave empty here.
# - initial migration is generated by scripts/gen_migrations.py offline from Base.metadata.
# NOTE: keep this file ASCII-only; Alembic reads it using the locale encoding.

[alembic]
script_location = migrations
prepend_sys_path = src
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S